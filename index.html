<script>

const U='https://github.com/hosea-joveldy/';
let PROJECTS=[
 {name:'luminix',desc:'My NixOS config.',lang:'Nix',color:'#05d9e8',commits:120,placeholder:true,style:'crown',slot:[1,3]},
 {name:'lumirices',desc:'A collection of my personal rices.',lang:'JSON',color:'#ff2a6d',commits:64,placeholder:true,style:'tiers',slot:[3,3]},
 {name:'stock-market-sim',desc:'Stock market simulator.',lang:'Python',color:'#fbff12',commits:38,placeholder:true,style:'chart',slot:[1,1]},
 {name:'orchestrated',desc:'My opencode setup.',lang:'Config',color:'#7b2cff',commits:85,placeholder:true,style:'rings',slot:[3,1]}];
const PROFILE={name:'Luminus',lines:['Sysadmin & Devops Hobbyist','Lives for ricing. Fluent in yaml 🍚','NixOS as daily drive 🌤️','Currently poking at Nvim and Context Engineering'],
 skills:[['NixOS','#5277C3'],['Nix','#5277C3'],['Docker','#2496ED'],['Python','#3776AB'],['FastAPI','#009688'],['React','#61DAFB'],['YAML','#CB171E'],['Linux','#FCC624'],['Git','#F05032'],['Figma','#F24E1E'],['Markdown','#000000']],

 (PROFILE.totalCommits?`<p>Total commits: <b>${PROFILE.totalCommits}</b></p>`:'')+`<p>★ Starred repos: <b>${PROFILE.starred}</b> · <a href="${U.slice(0,-1)}?tab=stars" target="_blank" rel="noopener">view all</a></p><p><a href="${U.slice(0,-1)}" target="_blank" rel="noopener">GitHub profile ↗</a></p>`;

function listView(on){const l=$('list');l.style.display=on?'block':'none';l.innerHTML='<h2>Projects</h2>'+PROJECTS.map(p=>`<div style="--a:${p.color}">${projHTML(p)}</div>`).join('')+'<h2>About</h2>'+aboutHTML()+'<p><button onclick="listView(false)">Close</button></p>'}
const API='https://api.github.com/',USER='hosea-joveldy',CV_FILE='cv.pdf';
const PAL=['#05d9e8','#ff2a6d','#fbff12','#7b2cff','#ff4ecd','#12e2a3','#ff9f1c','#3b82ff'],LC={Nix:'#05d9e8',JSON:'#ff2a6d',Python:'#fbff12',JavaScript:'#ff9f1c',TypeScript:'#3b82ff',Shell:'#12e2a3',Lua:'#7b2cff'};
const SLOTS=[[1,3],[3,3],[1,1],[3,1],[2,3],[2,1],[1,2],[3,2]];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function gh(path,count){const k='gh2:'+path+(count?'#n':'');try{const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.t<18e5)return c.d}catch(e){}
 const r=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status);let d=await r.json();
 if(count){const m=(r.headers.get('Link')||'').match(/[?&]page=(\d+)>; rel="last"/);d={n:m?+m[1]:d.length}}
 try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(e){}return d}
async function loadLive(){try{
 const rs=(await gh(`users/${USER}/repos?per_page=100&sort=pushed`)).filter(r=>!r.fork&&r.name!==USER).slice(0,8);if(!rs.length)return;
 const ST={luminix:'crown',lumirices:'tiers','stock-market-sim':'chart',orchestrated:'rings'},SK=['crown','tiers','chart','rings'];
 PROJECTS=await Promise.all(rs.map(async(r,i)=>{let n=null;try{n=(await gh(`repos/${USER}/${r.name}/commits?per_page=1`,1)).n}catch(e){}
  const o=PROJECTS.find(p=>p.name==r.name)||{};return{name:r.name,desc:r.description||o.desc||'No description yet.',lang:r.language||'Config',color:LC[r.language]||PAL[i%8],commits:n||o.commits||10,placeholder:!n,stars:r.stargazers_count,style:ST[r.name]||SK[i%4],slot:SLOTS[i]}}));
 PROJECTS.forEach(p=>p.url=U+p.name);try{PROFILE.starred=(await gh(`users/${USER}/starred?per_page=1`,1)).n}catch(e){}
}catch(e){console.warn('GitHub API unavailable, using bundled data',e)}}
const closeModal=()=>$('modal').style.display='none';addEventListener('keydown',e=>{if(e.code=='Escape')closeModal()});
async function openRepo(name){const p=PROJECTS.find(x=>x.name==name),m=$('modal');m.style.display='flex';m.style.setProperty('--a',p.color);
 m.innerHTML=`<div class="card"><button class="x" onclick="closeModal()">✕</button><h2>${esc(p.name)}</h2><div id="mb">Loading live data from GitHub…</div></div>`;
 try{const b=`repos/${USER}/${name}`,[r,c,br,lg]=await Promise.all([gh(b),gh(b+'/commits?per_page=5'),gh(b+'/branches?per_page=10'),gh(b+'/languages')]);const tot=Object.values(lg).reduce((a,b)=>a+b,0)||1;
 $('mb').innerHTML=`<p>${esc(r.description||p.desc)}</p><div class="grid"><div>★ ${r.stargazers_count}</div><div>⑂ ${r.forks_count}</div><div>⚠ ${r.open_issues_count}</div><div>${(r.size/1024).toFixed(1)} MB</div></div>
 <p>Default branch <b>${esc(r.default_branch)}</b> · created ${r.created_at.slice(0,10)} · pushed ${r.pushed_at.slice(0,10)}${r.license?' · '+esc(r.license.spdx_id):''}</p>
 <h3>Languages</h3><div class="bar">${Object.entries(lg).map(([k,v],i)=>`<i style="width:${v/tot*100}%;background:${PAL[i%8]}"></i>`).join('')}</div><p>${Object.entries(lg).map(([k,v],i)=>chip(esc(k)+' '+Math.round(v/tot*100)+'%',PAL[i%8])).join('')}</p>
 <h3>Branches (${br.length})</h3><p>${br.map(x=>chip(esc(x.name),'#7b2cff')).join('')}</p>
 <h3>Latest commits</h3>${c.map(x=>`<div class="cm"><a href="${esc(x.html_url)}" target="_blank" rel="noopener">${x.sha.slice(0,7)}</a> ${esc(x.commit.message.split('\n')[0])}<br><small>${esc(x.commit.author.name)} · ${x.commit.author.date.slice(0,10)}</small></div>`).join('')}
 ${r.topics&&r.topics.length?`<p>${r.topics.map(t=>chip('#'+esc(t),'#05d9e8')).join('')}</p>`:''}<p><a href="${p.url}" target="_blank" rel="noopener">Open on GitHub ↗</a>${r.homepage?` · <a href="${esc(r.homepage)}" target="_blank" rel="noopener">Live demo ↗</a>`:''}</p>`}
 catch(e){$('mb').innerHTML=`Could not reach the GitHub API (rate limit or offline). <a href="${p.url}" target="_blank" rel="noopener">Open on GitHub ↗</a>`}}
async function boot(){await loadLive();
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){listView(true);throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

/* ===== scene ===== */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2a0f5c);scene.fog=new THREE.FogExp2(0x2a0f5c,.0055);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,600);
scene.add(new THREE.HemisphereLight(0x8a5cff,0x1a0b4d,1.3));
const sun=new THREE.DirectionalLight(0xff2a6d,.45);sun.position.set(-50,100,30);scene.add(sun);
let composer;try{composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,cam));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,.7,.15))}catch(e){composer=null}
const A=[],walls=[],PITCH=34,RC=[...Array(6)].map((_,k)=>(k-2.5)*PITCH);
const bc=(i)=>(i-2)*PITCH;

const wc=document.createElement('canvas');wc.width=wc.height=64;{const g=wc.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,64,64);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(Math.random()<.65){g.globalAlpha=.4+Math.random()*.6;g.fillStyle='#fff';g.fillRect(i*16+3,j*16+4,10,8)}}
const wtex=new THREE.CanvasTexture(wc);wtex.wrapS=wtex.wrapT=THREE.RepeatWrapping;
function wmat(col,int,w,h){const t=wtex.clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.round(w/8)),Math.max(1,Math.round(h/8)));return new THREE.MeshStandardMaterial({color:0x0d1018,emissive:col,emissiveMap:t,emissiveIntensity:int,roughness:.4,metalness:.5})}
const neon=c=>new THREE.MeshBasicMaterial({color:c});
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);return o};
function sign(text,col,w){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.fillStyle='rgba(8,2,22,.92)';g.fillRect(0,0,512,96);g.strokeStyle=col;g.lineWidth=5;g.shadowColor=col;g.shadowBlur=12;g.strokeRect(6,6,500,84);g.font='bold 44px monospace';g.textAlign='center';g.fillStyle=col;g.fillText(text.toUpperCase().slice(0,16),256,64);
 return new THREE.Mesh(new THREE.PlaneGeometry(w,w*96/512),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}))}

function vsign(text,col,hh=11){const c=document.createElement('canvas');c.width=96;c.height=384;const g=c.getContext('2d');g.fillStyle='rgba(8,2,22,.92)';g.fillRect(0,0,96,384);g.strokeStyle=col;g.lineWidth=5;g.shadowColor=col;g.shadowBlur=12;g.strokeRect(5,5,86,374);g.font='bold 50px monospace';g.textAlign='center';g.fillStyle=col;[...text.toUpperCase()].slice(0,6).forEach((ch,i)=>g.fillText(ch,48,62+i*58));
 return new THREE.Mesh(new THREE.PlaneGeometry(hh/4,hh),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,side:THREE.DoubleSide}))}
const VW=['ネオン','電脳街','ホテル','BAR','RAMEN','24H','CYBER','SYNTH'];
/* ground, sidewalks, lane dashes */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x0d0a28,roughness:.12,metalness:.8}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const swm=new THREE.MeshStandardMaterial({color:0x1a1c40,roughness:.8});
for(let i=0;i<5;i++)for(let j=0;j<5;j++)scene.add(box(24,.4,24,swm,bc(i),0,bc(j)));
{const dm=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.03,3),neon(0xfbff12),400);let n=0,m=new THREE.Matrix4();
 const near=u=>RC.some(r=>Math.abs(r-u)<8);
 RC.forEach(r=>{for(let u=-100;u<100&&n<398;u+=6){if(near(u))continue;m.makeTranslation(r,.03,u);dm.setMatrixAt(n++,m);m.makeRotationY(Math.PI/2).setPosition(u,.03,r);dm.setMatrixAt(n++,m)}});dm.count=n;scene.add(dm)}

/* traffic lights: 36 intersections, NS head + EW head */
const LH=new THREE.InstancedMesh(new THREE.SphereGeometry(.6,8,8),new THREE.MeshBasicMaterial({color:0xffffff}),72),LP=new THREE.InstancedMesh(new THREE.CylinderGeometry(.12,.12,5,5),new THREE.MeshStandardMaterial({color:0x333845}),72);
{const m=new THREE.Matrix4();let n=0;RC.forEach(x=>RC.forEach(z=>{[[x+5.5,z-5.5],[x-5.5,z+5.5]].forEach(([a,b])=>{m.makeTranslation(a,2.5,b);LP.setMatrixAt(n,m);m.makeTranslation(a,5.3,b);LH.setMatrixAt(n,m);n++})}));scene.add(LH,LP)}
const lcol=[new THREE.Color(0x22ff66),new THREE.Color(0xffcc00),new THREE.Color(0xff2233)];
function phase(t){const p=t%20;return p<8?[0,2]:p<10?[1,2]:p<18?[2,0]:[2,1]} // [NS state, EW state]
function lights(t){const [a,b]=phase(t);for(let i=0;i<72;i++)LH.setColorAt(i,lcol[i%2?b:a]);LH.instanceColor.needsUpdate=true}

/* cars: body, cabin, 4 wheels, head/tail lights, underglow */
const NC=48,cars=[],NEON=[0xff2a6d,0x05d9e8,0xfbff12,0x7b2cff,0xff4ecd,0x1a1c40];
const IM=(g,m,n)=>{const x=new THREE.InstancedMesh(g,m,n);scene.add(x);return x};
const CB=IM(new THREE.BoxGeometry(2,.7,4.4),new THREE.MeshStandardMaterial({color:0xffffff,metalness:.8,roughness:.25}),NC),
CC=IM(new THREE.BoxGeometry(1.7,.6,2.2),new THREE.MeshStandardMaterial({color:0x0b1020,emissive:0x05d9e8,emissiveIntensity:.3,metalness:.9,roughness:.1}),NC),
CW=IM(new THREE.CylinderGeometry(.42,.42,.3,12).rotateZ(Math.PI/2),new THREE.MeshStandardMaterial({color:0x111111}),NC*4),
CH=IM(new THREE.BoxGeometry(.5,.25,.1),new THREE.MeshBasicMaterial({color:0xfff6c8}),NC*2),
CT=IM(new THREE.BoxGeometry(.5,.2,.1),new THREE.MeshBasicMaterial({color:0xff1133}),NC*2),
CU=IM(new THREE.BoxGeometry(1.8,.05,4),new THREE.MeshBasicMaterial({color:0xffffff}),NC);
for(let i=0;i<NC;i++){const c=new THREE.Color(NEON[i%6]);CB.setColorAt(i,c);CU.setColorAt(i,c);cars.push({h:i%2==0,d:Math.random()<.5?1:-1,r:RC[Math.floor(R(0,6))],u:R(-100,100),v:R(7,11)})}
const B=new THREE.Matrix4(),L=new THREE.Matrix4(),Q=new THREE.Matrix4(),Sm=new THREE.Matrix4(),DM=new THREE.Object3D();
const put=(m,i,x,y,z,a=0,bs=B)=>{L.makeRotationX(a).setPosition(x,y,z);Q.multiplyMatrices(bs,L);m.setMatrixAt(i,Q)};
function stepCars(dt,t){const [ns,ew]=phase(t);cars.forEach((c,i)=>{const g=c.h?ew:ns;let stop=false;
 if(g!==0)RC.forEach(r=>{const dd=(r-c.u)*c.d;if(dd>5&&dd<9)stop=true});
 if(!stop){c.u+=c.d*c.v*dt;if(c.u>105)c.u=-105;if(c.u<-105)c.u=105}
 const l=c.d*2.6,x=c.h?c.u:c.r-l,z=c.h?c.r+l:c.u;B.makeRotationY(c.h?c.d*Math.PI/2:(c.d>0?0:Math.PI)).setPosition(x,0,z);
 put(CB,i,0,.55,0);put(CC,i,0,1.15,-.2);put(CU,i,0,.12,0);const sp=c.u*.6;
 [[-1,1.45],[1,1.45],[-1,-1.45],[1,-1.45]].forEach(([a,b],k)=>put(CW,i*4+k,a*1.0,.42,b,sp));
 put(CH,i*2,-.65,.6,2.2);put(CH,i*2+1,.65,.6,2.2);put(CT,i*2,-.65,.65,-2.2);put(CT,i*2+1,.65,.65,-2.2)});
 [CB,CC,CW,CH,CT,CU].forEach(m=>m.instanceMatrix.needsUpdate=true)}

/* buildings */
const isP=(i,j)=>PROJECTS.find(p=>p.slot[0]==i&&p.slot[1]==j);
function project(p,cx,cz){const col=new THREE.Color(p.color),g=new THREE.Group(),h=Math.min(95,Math.max(24,16+Math.sqrt(p.commits)*6.5)),w=p.style=='chart'?18:14,M=(hh,ww=w)=>wmat(col,1.3,ww,hh);g.position.set(cx,0,cz);
 if(p.style=='crown'){g.add(box(14,h,14,M(h),0,.4,0));g.add(box(.6,14,.6,neon(0xffffff),0,h,0));
  const c=new THREE.Group();c.position.y=h+8;for(let i=0;i<6;i++){const a=i*Math.PI/3,arm=box(1.2,.6,5.5,neon(i%2?0x5277c3:0x7ebae4),0,-.3,0);arm.position.x=Math.cos(a)*3.4;arm.position.z=Math.sin(a)*3.4;arm.rotation.y=-a+Math.PI/2;c.add(arm)}g.add(c);A.push((t,dt)=>{c.rotation.y+=dt*.7;c.position.y=h+8+Math.sin(t*2)*.6})}
 if(p.style=='tiers'){const pal=[0xff4fa3,0xffd23f,0x44ffee];let y=.4;[[14,.5],[11,.3],[8,.2]].forEach(([ww,f],i)=>{const th=h*f;g.add(box(ww,th,ww,M(th,ww),0,y,0));y+=th;g.add(box(ww+.5,.5,ww+.5,neon(pal[i]),0,y,0));y+=.5});
  const tree=new THREE.Mesh(new THREE.ConeGeometry(1.6,3.5,6),neon(0x55ff88));tree.position.y=y+1.8;g.add(tree)}
 if(p.style=='chart'){g.add(box(18,h,14,M(h),0,.4,0));const bars=[];for(let i=0;i<7;i++){const b=box(1.6,1,1.6,new THREE.MeshBasicMaterial({color:0x33ff66}),-6+i*2,0,0);b.position.y=h;g.add(b);bars.push(b)}

 const pp=$('pp');if(key!==shown){shown=key;pp.style.display=key?'block':'none';pp.innerHTML=html;pp.style.setProperty('--a',acc)}
 fc++;ft+=dt;if(ft>.5){fps=Math.round(fc/ft);fc=ft=0;
 $('hud').innerHTML=`<b style="color:#05d9e8">LUMINUS // NEON CITY</b><br>FPS ${fps} · X ${cam.position.x.toFixed(0)} Z ${cam.position.z.toFixed(0)}<br>Nearest: <span style="color:#ff2a6d">${p.name}</span> (${d.toFixed(0)}m)<br>Tour ${tour?'ON':'off'} · Rain ${rain.visible?'on':'off'}<br>WASD move · Shift sprint · drag look<br>T tour · R rain · P people · L list<br><button onclick="listView(true)">List view</button>`}}

/* loop */
let last=performance.now(),T=0;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer&&composer.setSize(innerWidth,innerHeight)});
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 tour?tourStep(dt):move(dt);cam.position.y=1.7;cam.rotation.set(pitch,yaw,0,'YXZ');
 lights(T);stepCars(dt,T);stepPeds(dt);stepRain(dt);A.forEach(f=>f(T,dt));ui(dt);
 composer?composer.render():renderer.render(scene,cam)})(performance.now());
window.__cityReady=true;}
boot();
</script></body></html>
