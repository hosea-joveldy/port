<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

</style></head><body>
<div class="hud" id="hud"></div>
<div class="panel" id="pp"></div>
<div class="panel" id="list"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
/* ===== DATA — edit here. commits are PLACEHOLDERS until you fill real numbers. style = unique building type ===== */
const U='https://github.com/hosea-joveldy/';
const PROJECTS=[
 {name:'luminix',desc:'My NixOS config.',lang:'Nix',color:'#7ebae4',commits:120,placeholder:true,style:'crown',slot:[1,3]},
 {name:'lumirices',desc:'A collection of my personal rices.',lang:'JSON',color:'#ff4fa3',commits:64,placeholder:true,style:'tiers',slot:[3,3]},
 {name:'stock-market-sim',desc:'Stock market simulator.',lang:'Python',color:'#ffcf33',commits:38,placeholder:true,style:'chart',slot:[1,1]},
 {name:'orchestrated',desc:'My opencode setup.',lang:'Config',color:'#a66bff',commits:85,placeholder:true,style:'rings',slot:[3,1]}];
const PROFILE={name:'Luminus',lines:['Sysadmin & Devops Hobbyist','Lives for ricing. Fluent in yaml 🍚','NixOS as daily drive 🌤️','Currently poking at Nvim and Context Engineering'],
 skills:[['NixOS','#5277C3'],['Nix','#5277C3'],['Docker','#2496ED'],['Python','#3776AB'],['FastAPI','#009688'],['React','#61DAFB'],['YAML','#CB171E'],['Linux','#FCC624'],['Git','#F05032'],['Figma','#F24E1E'],['Markdown','#000000']],
 totalCommits:null,starred:14};
PROJECTS.forEach(p=>p.url=U+p.name);

/* ===== helpers ===== */
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);
const chip=(t,c)=>{const n=parseInt(c.slice(1),16),l=((n>>16)*.3+((n>>8)&255)*.6+(n&255)*.1);return `<span class="chip" style="background:${c};color:${l>150?'#000':'#fff'}">${t}</span>`};
const aboutHTML=()=>`<h2>${PROFILE.name}</h2>${PROFILE.lines.map(l=>`<p>${l}</p>`).join('')}<p>${PROFILE.skills.map(s=>chip(s[0],s[1])).join('')}</p>`+
 (PROFILE.totalCommits?`<p>Total commits: <b>${PROFILE.totalCommits}</b></p>`:'')+`<p>★ Starred repos: <b>${PROFILE.starred}</b> · <a href="${U.slice(0,-1)}?tab=stars" target="_blank" rel="noopener">view all</a></p><p><a href="${U.slice(0,-1)}" target="_blank" rel="noopener">GitHub profile ↗</a></p>`;
const projHTML=p=>`<h2>${p.name}</h2><p>${p.desc}</p><p>${chip(p.lang,p.color)}</p><p>Total commits: <b>${p.commits}</b>${p.placeholder?' (placeholder)':''}</p><p><a href="${p.url}" target="_blank" rel="noopener">Repo ↗</a></p>`;
function listView(on){const l=$('list');l.style.display=on?'block':'none';l.innerHTML='<h2>Projects</h2>'+PROJECTS.map(p=>`<div style="--a:${p.color}">${projHTML(p)}</div>`).join('')+'<h2>About</h2>'+aboutHTML()+'<p><button onclick="listView(false)">Close</button></p>'}
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){listView(true);throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

/* ===== scene ===== */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05060d);scene.fog=new THREE.FogExp2(0x070a16,.011);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,600);
scene.add(new THREE.HemisphereLight(0x4466aa,0x110818,.8));
const sun=new THREE.DirectionalLight(0x7788ff,.35);sun.position.set(-50,100,30);scene.add(sun);
let composer;try{composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,cam));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.9,.6,.2))}catch(e){composer=null}
const A=[],walls=[],PITCH=34,RC=[...Array(6)].map((_,k)=>(k-2.5)*PITCH);
const bc=(i)=>(i-2)*PITCH;

const wc=document.createElement('canvas');wc.width=wc.height=64;{const g=wc.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,64,64);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(Math.random()<.65){g.globalAlpha=.4+Math.random()*.6;g.fillStyle='#fff';g.fillRect(i*16+3,j*16+4,10,8)}}
const wtex=new THREE.CanvasTexture(wc);wtex.wrapS=wtex.wrapT=THREE.RepeatWrapping;
function wmat(col,int,w,h){const t=wtex.clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.round(w/8)),Math.max(1,Math.round(h/8)));return new THREE.MeshStandardMaterial({color:0x0d1018,emissive:col,emissiveMap:t,emissiveIntensity:int,roughness:.4,metalness:.5})}
const neon=c=>new THREE.MeshBasicMaterial({color:c});
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);return o};
function sign(text,col,w){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.font='bold 54px monospace';g.textAlign='center';g.fillStyle=col;g.shadowColor=col;g.shadowBlur=14;g.fillText(text.toUpperCase().slice(0,16),256,66);
 return new THREE.Mesh(new THREE.PlaneGeometry(w,w*96/512),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}))}

/* ground, sidewalks, lane dashes */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x090b13,roughness:.25,metalness:.6}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const swm=new THREE.MeshStandardMaterial({color:0x1b1f2e,roughness:.8});
for(let i=0;i<5;i++)for(let j=0;j<5;j++)scene.add(box(24,.4,24,swm,bc(i),0,bc(j)));
{const dm=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.03,3),neon(0xffd24a),400);let n=0,m=new THREE.Matrix4();
 const near=u=>RC.some(r=>Math.abs(r-u)<8);
 RC.forEach(r=>{for(let u=-100;u<100&&n<398;u+=6){if(near(u))continue;m.makeTranslation(r,.03,u);dm.setMatrixAt(n++,m);m.makeRotationY(Math.PI/2).setPosition(u,.03,r);dm.setMatrixAt(n++,m)}});dm.count=n;scene.add(dm)}

/* traffic lights: 36 intersections, NS head + EW head */
const LH=new THREE.InstancedMesh(new THREE.SphereGeometry(.6,8,8),new THREE.MeshBasicMaterial({color:0xffffff}),72),LP=new THREE.InstancedMesh(new THREE.CylinderGeometry(.12,.12,5,5),new THREE.MeshStandardMaterial({color:0x333845}),72);
{const m=new THREE.Matrix4();let n=0;RC.forEach(x=>RC.forEach(z=>{[[x+5.5,z-5.5],[x-5.5,z+5.5]].forEach(([a,b])=>{m.makeTranslation(a,2.5,b);LP.setMatrixAt(n,m);m.makeTranslation(a,5.3,b);LH.setMatrixAt(n,m);n++})}));scene.add(LH,LP)}
const lcol=[new THREE.Color(0x22ff66),new THREE.Color(0xffcc00),new THREE.Color(0xff2233)];
function phase(t){const p=t%20;return p<8?[0,2]:p<10?[1,2]:p<18?[2,0]:[2,1]} // [NS state, EW state]
function lights(t){const [a,b]=phase(t);for(let i=0;i<72;i++)LH.setColorAt(i,lcol[i%2?b:a]);LH.instanceColor.needsUpdate=true}

/* cars */
const cars=[];const CM=new THREE.InstancedMesh(new THREE.BoxGeometry(2,1.1,4.2),new THREE.MeshBasicMaterial({color:0xffffff}),50);
for(let i=0;i<50;i++){const h=i%2==0,d=Math.random()<.5?1:-1;cars.push({h,d,r:RC[Math.floor(R(0,6))],u:R(-100,100),v:R(7,11)});CM.setColorAt(i,new THREE.Color().setHSL(Math.random(),.9,.55))}
scene.add(CM);
const DM=new THREE.Object3D();
function stepCars(dt,t){const [ns,ew]=phase(t);cars.forEach((c,i)=>{const g=c.h?ew:ns;let stop=false;
 if(g!==0)RC.forEach(r=>{const dd=(r-c.u)*c.d;if(dd>5&&dd<9)stop=true});
 if(!stop){c.u+=c.d*c.v*dt;if(c.u>105)c.u=-105;if(c.u<-105)c.u=105}
 const l=c.d*2.6;c.h?DM.position.set(c.u,.7,c.r+l):DM.position.set(c.r-l,.7,c.u);DM.rotation.y=c.h?Math.PI/2:0;DM.updateMatrix();CM.setMatrixAt(i,DM.matrix)});CM.instanceMatrix.needsUpdate=true}

/* buildings */
const isP=(i,j)=>PROJECTS.find(p=>p.slot[0]==i&&p.slot[1]==j);
function project(p,cx,cz){const col=new THREE.Color(p.color),g=new THREE.Group(),h=Math.min(95,Math.max(24,16+Math.sqrt(p.commits)*6.5)),w=p.style=='chart'?18:14,M=(hh,ww=w)=>wmat(col,1.3,ww,hh);g.position.set(cx,0,cz);
 if(p.style=='crown'){g.add(box(14,h,14,M(h),0,.4,0));g.add(box(.6,14,.6,neon(0xffffff),0,h,0));
  const c=new THREE.Group();c.position.y=h+8;for(let i=0;i<6;i++){const a=i*Math.PI/3,arm=box(1.2,.6,5.5,neon(i%2?0x5277c3:0x7ebae4),0,-.3,0);arm.position.x=Math.cos(a)*3.4;arm.position.z=Math.sin(a)*3.4;arm.rotation.y=-a+Math.PI/2;c.add(arm)}g.add(c);A.push((t,dt)=>{c.rotation.y+=dt*.7;c.position.y=h+8+Math.sin(t*2)*.6})}
 if(p.style=='tiers'){const pal=[0xff4fa3,0xffd23f,0x44ffee];let y=.4;[[14,.5],[11,.3],[8,.2]].forEach(([ww,f],i)=>{const th=h*f;g.add(box(ww,th,ww,M(th,ww),0,y,0));y+=th;g.add(box(ww+.5,.5,ww+.5,neon(pal[i]),0,y,0));y+=.5});
  const tree=new THREE.Mesh(new THREE.ConeGeometry(1.6,3.5,6),neon(0x55ff88));tree.position.y=y+1.8;g.add(tree)}
 if(p.style=='chart'){g.add(box(18,h,14,M(h),0,.4,0));const bars=[];for(let i=0;i<7;i++){const b=box(1.6,1,1.6,new THREE.MeshBasicMaterial({color:0x33ff66}),-6+i*2,0,0);b.position.y=h;g.add(b);bars.push(b)}
  A.push(t=>bars.forEach((b,i)=>{const s=2+(Math.sin(t*1.5+i*1.3)+1)*3;b.scale.y=s;b.position.y=h+s/2+.4;b.material.color.setHex(Math.cos(t*1.5+i*1.3)>0?0x33ff66:0xff4455)}))}
 if(p.style=='rings'){g.add(box(14,h*.55,14,M(h*.55),0,.4,0));const sp=new THREE.Mesh(new THREE.CylinderGeometry(1.2,3,h*.5,8),new THREE.MeshStandardMaterial({color:0x120a22,emissive:col,emissiveIntensity:.8}));sp.position.y=h*.55+h*.25;g.add(sp);
  [.62,.78,.92].forEach((f,i)=>{const r=new THREE.Group(),R0=5+i*1.3;r.position.y=h*f+.4;const tr=new THREE.Mesh(new THREE.TorusGeometry(R0,.12,6,40),neon(p.color));tr.rotation.x=Math.PI/2;const nd=new THREE.Mesh(new THREE.SphereGeometry(.7,8,8),neon(0xffffff));nd.position.x=R0;r.add(tr,nd);g.add(r);A.push((t,dt)=>{r.rotation.y+=dt*(.8+i*.5)*(i%2?-1:1)})})}
 const s=sign(p.name,p.color,12);s.position.set(0,Math.min(h*.5,18),7.1);g.add(s);
 const door=new THREE.Mesh(new THREE.PlaneGeometry(3,4),neon(p.color));door.position.set(0,2.4,7.1);g.add(door);
 scene.add(g);walls.push([cx-w/2,cx+w/2,cz-7,cz+7]);p.door=[cx,cz+7];p.pos=[cx,cz]}
const grayCols=[0x8899aa,0x99aabb,0x7a8fa8];
function gray(x,z,w,d,h){scene.add(box(w,h,d,wmat(grayCols[Math.floor(R(0,3))],.35,w,h),x,.4,z));if(Math.random()<.5)scene.add(box(.4,R(3,8),.4,neon(0xff2244),x,h+.4,z));return[x-w/2,x+w/2,z-d/2,z+d/2]}
for(let i=0;i<5;i++)for(let j=0;j<5;j++){if(i==2&&j==2)continue;const p=isP(i,j);if(p)project(p,bc(i),bc(j));else walls.push(gray(bc(i),bc(j),R(12,16),R(12,16),R(14,58)))}
for(let k=0;k<44;k++){const a=k/44*Math.PI*2,r=R(135,190);gray(Math.cos(a)*r,Math.sin(a)*r,R(14,24),R(14,24),R(40,110))}

/* park + NixOS statue */
const statue=new THREE.Group();scene.add(statue);
statue.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(10,10,.3,40),new THREE.MeshStandardMaterial({color:0x07142a,emissive:0x16408a,emissiveIntensity:.6,roughness:.1,metalness:.8})),{}));
const ring=new THREE.Mesh(new THREE.TorusGeometry(9,.15,6,60),neon(0x7ebae4));ring.rotation.x=Math.PI/2;ring.position.y=.4;statue.add(ring);
statue.add(box(4.4,3,4.4,new THREE.MeshStandardMaterial({color:0x151a2a,roughness:.5,metalness:.7}),0,.3,0));
const flake=new THREE.Group();flake.position.y=8;for(let i=0;i<6;i++){const a=i*Math.PI/3,arm=box(2,.9,6,neon(i%2?0x5277c3:0x7ebae4),0,-.45,0);arm.position.set(Math.cos(a)*3.6,0,Math.sin(a)*3.6);arm.rotation.y=-a+Math.PI/2;flake.add(arm)}statue.add(flake);
const sl=new THREE.PointLight(0x5a8cff,2,45);sl.position.y=9;statue.add(sl);A.push((t,dt)=>{flake.rotation.y+=dt*.5;flake.position.y=8+Math.sin(t*1.5)*.5});
walls.push([-5,5,-5,5]);

/* people: wanderers loop block sidewalks, visitors walk into project doors (rate ~ sqrt(commits)) */
const NP=200,PM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,.3,1.7,6),new THREE.MeshBasicMaterial({color:0xffffff}),NP);scene.add(PM);
const ringPos=(cx,cz,t)=>{const s=11.5,L=8*s,p=((t%L)+L)%L,k=Math.floor(p/(2*s)),f=p-k*2*s-s;return k==0?[cx+f,cz+s]:k==1?[cx+s,cz-f]:k==2?[cx-f,cz-s]:[cx-s,cz+f]};
const peds=[];{const tot=PROJECTS.reduce((a,p)=>a+Math.sqrt(p.commits),0),V=70;const vis=[];PROJECTS.forEach(p=>{for(let n=Math.round(V*Math.sqrt(p.commits)/tot);n>0;n--)vis.push(p)});
 for(let i=0;i<NP;i++){const p=vis[i];const o={p,s:1,wait:R(0,5)};if(!p){o.bi=Math.floor(R(0,5));o.bj=Math.floor(R(0,5));o.t=R(0,92);o.d=Math.random()<.5?1:-1}peds.push(o);PM.setColorAt(i,p?new THREE.Color(p.color):new THREE.Color().setHSL(R(.5,.95),.5,.4))}}
function spawn(o){o.st=0;o.s=1;o.x=o.p.door[0]+R(-16,16);o.z=o.p.pos[1]+11.5}
peds.forEach(o=>{if(o.p)spawn(o)});
let showPeds=true;
function stepPeds(dt){peds.forEach((o,i)=>{let x,z;
 if(!o.p){o.t+=o.d*1.4*dt;[x,z]=ringPos(bc(o.bi),bc(o.bj),o.t)}
 else{if(o.wait>0){o.wait-=dt;o.s=0}else{const [dx,dz]=o.p.door;if(o.st==0){const e=dx-o.x;o.x+=Math.sign(e)*Math.min(Math.abs(e),1.6*dt);if(Math.abs(e)<.1)o.st=1}else if(o.st==1){o.z-=1.6*dt;if(o.z<=dz+.3)o.st=2}else{o.s-=dt*2;if(o.s<=0){o.wait=R(0,6);spawn(o);o.s=0}}if(o.st<2)o.s=1}x=o.x;z=o.z}
 DM.position.set(x,.85*Math.max(o.s,.01),z);DM.rotation.set(0,0,0);DM.scale.setScalar(showPeds?Math.max(o.s,.001):.001);DM.updateMatrix();PM.setMatrixAt(i,DM.matrix)});DM.scale.setScalar(1);PM.instanceMatrix.needsUpdate=true}

/* rain */
const RN=1500,rp=new Float32Array(RN*6);for(let i=0;i<RN;i++){const x=R(-40,40),y=R(-5,40),z=R(-40,40);rp.set([x,y,z,x,y-1.2,z],i*6)}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(rp,3));const rain=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0x8fb4ff,transparent:true,opacity:.35}));rain.frustumCulled=false;scene.add(rain);
function stepRain(dt){for(let i=0;i<RN;i++){let y=rp[i*6+1]-45*dt;if(y<0)y+=40;rp[i*6+1]=y;rp[i*6+4]=y-1.2}rg.attributes.position.needsUpdate=true;rain.position.copy(cam.position)}

/* controls: WASD, Shift sprint, drag to look, T tour, R rain, P people, L list */
let yaw=0,pitch=0,tour=matchMedia('(pointer:coarse)').matches,ti=0,tt=0,drag=false;cam.position.set(0,1.7,85);
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyT'){tour=!tour;tt=0}else if(e.code=='KeyR')rain.visible=!rain.visible;else if(e.code=='KeyP')showPeds=!showPeds;else if(e.code=='KeyL')listView($('list').style.display!='block');else if(/Key[WASD]|Arrow/.test(e.code))tour=false});addEventListener('keyup',e=>K[e.code]=0);
const cv=renderer.domElement;cv.onpointerdown=()=>drag=true;addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw-=e.movementX*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.004))}});
function move(dt){const sp=(K.ShiftLeft?15:7)*dt,f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),s=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
 cam.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;cam.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
 walls.forEach(([a,b,c,d])=>{const x=cam.position.x,z=cam.position.z,m=1;if(x>a-m&&x<b+m&&z>c-m&&z<d+m){const l=[x-(a-m),b+m-x,z-(c-m),d+m-z],mn=Math.min(...l);if(mn==l[0])cam.position.x=a-m;else if(mn==l[1])cam.position.x=b+m;else if(mn==l[2])cam.position.z=c-m;else cam.position.z=d+m}})}
function tourStep(dt){tt+=dt;const p=PROJECTS[ti%PROJECTS.length],tx=p.door[0],tz=p.pos[1]+17;cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*.8);cam.position.z+=(tz-cam.position.z)*Math.min(1,dt*.8);
 let ty=Math.atan2(-(p.pos[0]-cam.position.x),-(p.pos[1]-cam.position.z)),df=Math.atan2(Math.sin(ty-yaw),Math.cos(ty-yaw));yaw+=df*Math.min(1,dt*2);pitch*=.95;if(tt>9){tt=0;ti++}}

/* HUD + proximity */
let shown=null,fps=0,fc=0,ft=0;
function nearest(){let best=null,bd=1e9;PROJECTS.forEach(p=>{const d=Math.hypot(p.door[0]-cam.position.x,p.door[1]-cam.position.z);if(d<bd){bd=d;best=p}});return[best,bd]}
function ui(dt){const [p,d]=nearest(),ds=Math.hypot(cam.position.x,cam.position.z);let key=null,html='',acc='#5ff';
 if(d<22){key=p.name;html=projHTML(p);acc=p.color}else if(ds<24){key='about';html=aboutHTML();acc='#7ebae4'}
 const pp=$('pp');if(key!==shown){shown=key;pp.style.display=key?'block':'none';pp.innerHTML=html;pp.style.setProperty('--a',acc)}
 fc++;ft+=dt;if(ft>.5){fps=Math.round(fc/ft);fc=ft=0;
